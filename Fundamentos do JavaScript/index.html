<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudações meu amigo!</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="Scripts/script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="https://w7.pngwing.com/pngs/14/659/png-transparent-less-than-sign-symbol-greater-than-sign-computer-icons-plus-and-minus-signs-symbol-miscellaneous-angle-hand.png">
</head>

<body class="body">

    <div class="titulo">
        <h1 class="tituloTexto">Saudações!</h1>
        <img class="imagemBoasVindas" src="https://media.tenor.com/8wkOxfXEizUAAAAM/bye-bye.gif" alt="imagem de boas vindas">
    </div>

    <div class="caixa-texto">
        <p>Qual é o seu nome?</p>
        <textarea class="caixaTexto" rows="1" cols="30" placeholder="Digite seu nome..."></textarea> <br>
        <button id="botao-enviar" class="botao-enviar">Saudar!</button>
    </div>

    <div> <p id="mensagem" class="mensagem"></p> </div>

    <div class="caixa-texto">
        <p>Qual é a sua idade?</p>
        <textarea class="caixaTexto-idade" rows="1" cols="30" placeholder="Digite sua idade..."></textarea> <br>
        <button id="botao-enviar-idade" class="botao-enviar">Saudar!</button>
    </div>

    <div> <p id="mensagem-idade" class="mensagem"></p> </div>
    
</body>
</html>
