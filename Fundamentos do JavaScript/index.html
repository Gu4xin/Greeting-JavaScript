<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos do JavaScript</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="script.js" defer></script>
</head>
<body class="body">

    <div class="titulo">
        <h1 class="tituloTexto">Saudações!</h1>
        <img class="imagemBoasVindas" src="https://media.tenor.com/8wkOxfXEizUAAAAM/bye-bye.gif" alt="imagem de boas vindas">
    </div>

    <div class="caixa-texto">
        <p>Qual é o seu nome?</p>
        <textarea class="caixaTexto" rows="1" cols="30" placeholder="Digite seu nome..."></textarea> <br>
        <button class="botao-enviar">Saudar!</button>
    </div>

    <div> <p class="mensagem"></p> </div>

    <div class="caixa-texto">
        <p>Qual é a sua idade?</p>
        <textarea class="caixaTexto" rows="1" cols="30" placeholder="Digite sua idade..."></textarea> <br>
        <button class="botao-enviar">Saudar!</button>
    </div>

    <div> <p class="mensagem"></p> </div>
    
</body>
</html>
